<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>런투게더 파티 참여</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding-top: 50px; background: #000; color: #fff; }
    .loader { margin: 20px auto; border: 4px solid #333; border-top: 4px solid #D4FF00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
    .subtitle { color: #888; font-size: 14px; }
  </style>
  <script>
    window.onload = function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var pw = params.get('pw') || '';
      if (id) {
        var deepLink = "runtogether://join?id=" + encodeURIComponent(id) + "&pw=" + encodeURIComponent(pw);
        window.location.href = deepLink;
        
        // 2초 후에도 안 열리면 마켓으로 안내
        setTimeout(function() {
          var isAndroid = /android/i.test(navigator.userAgent);
          if (isAndroid) {
            window.location.href = "market://details?id=com.runtogether.running_app";
          }
        }, 2000);
      } else {
        document.getElementById('msg').innerText = "잘못된 접근입니다.";
        document.getElementById('loader').style.display = 'none';
      }
    };
  </script>
</head>
<body>
  <div class="title">🏃 런투게더 앱으로 연결 중...</div>
  <div class="subtitle" id="msg">화면이 넘어가지 않으면 브라우저 설정에서 '앱 열기'를 허용해주세요.</div>
  <div class="loader" id="loader"></div>
</body>
</html>
